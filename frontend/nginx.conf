# Config do nginx que serve o BodyTrack (SPA + PWA) em produção.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Service worker e manifest NUNCA podem ficar em cache do navegador
    # ou de um CDN na frente do nginx: se ficarem, o usuário nunca
    # recebe a versão nova do app depois de um deploy (o PWA fica
    # "preso" numa versão antiga do service worker, que por sua vez
    # decide o que mais fica em cache offline).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Assets com hash no nome (JS/CSS gerados pelo Vite) podem ficar em
    # cache por muito tempo: se o conteúdo mudar, o nome do arquivo muda
    # junto.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse proxy para a API (só existe no docker-compose.prod.yml,
    # onde o serviço se chama "api" na rede interna do Compose). Manter
    # front e back no mesmo domínio evita configurar CORS em produção
    # e permite VITE_API_URL=/api/v1 (caminho relativo) no build do
    # frontend — ver .env.example na raiz do projeto.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: qualquer rota que não seja um arquivo estático
    # real (ex.: /treino, /evolucao) devolve index.html, e o
    # react-router decide o que renderizar no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
