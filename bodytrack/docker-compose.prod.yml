# Stack de produção: constrói as imagens (nenhuma monta código do
# host), roda migrations automaticamente na subida da API
# (backend/entrypoint.sh) e serve o frontend já compilado atrás de
# nginx, que também faz proxy de /api para o backend — front e back
# ficam no mesmo domínio, então não é preciso configurar CORS nem
# apontar VITE_API_URL para um host separado.
#
# Uso:
#   cp .env.example .env   # ajuste as senhas/segredos
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#
# Ver a seção "Deploy" do README para colocar HTTPS na frente disso
# (Caddy/Traefik/nginx externo) e para as alternativas de PaaS.
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bodytrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bodytrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bodytrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem "ports:" aqui de propósito — em produção o Postgres só
    # precisa ser alcançável pela API, dentro da rede interna do
    # Compose, nunca exposto na internet.

  api:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bodytrack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bodytrack}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ENV: production
      DEBUG: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      STORAGE_LOCAL_PATH: storage/photos
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - photos:/app/storage/photos
    # Sem "ports:" publicada para o host: só o nginx do serviço
    # "frontend" fala com a API, via /api/ (ver frontend/nginx.conf).

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  photos:
